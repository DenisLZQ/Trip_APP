<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>L.L的智能行程管家</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f7fb;color:#1e293b}
  .scrollbar::-webkit-scrollbar{width:6px;height:6px}
  .scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
  .cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;position:relative;transition:.15s;font-size:14px;color:#334155}
  .cal-cell:hover{background:#e0f2fe}
  .cal-cell.other{color:#cbd5e1;cursor:default}
  .cal-cell.other:hover{background:transparent}
  .cal-cell.today{background:#fef3c7;font-weight:600}
  .cal-cell.has-trip{background:linear-gradient(135deg,#e0f2fe,#bae6fd);color:#0369a1;font-weight:600}
  .cal-cell.has-trip::after{content:'';position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:#0284c7}
  .cal-cell.selected{background:#0284c7;color:#fff}
  .cal-cell.selected::after{background:#fff}
  .day-dot{width:6px;height:6px;border-radius:50%;background:#0284c7;margin-top:2px}
  .nav-trip-item{transition:.15s}
  .nav-trip-item.active{background:linear-gradient(90deg,#0ea5e9,#06b6d4);color:#fff}
  .nav-day-item{font-size:13px;color:#64748b;padding:6px 12px 6px 36px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:.12s}
  .nav-day-item:hover{background:#f1f5f9;color:#0369a1}
  .nav-day-item.active{background:#e0f2fe;color:#0369a1;font-weight:500}
  .chat-row{display:flex;gap:8px;align-items:flex-start;max-width:100%}
  .chat-row.me{flex-direction:row-reverse;align-self:flex-end}
  .chat-row.ai{align-self:flex-start}
  .chat-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;overflow:hidden;background-size:cover;background-position:center}
  .chat-avatar.user{background:linear-gradient(135deg,#38bdf8,#0ea5e9)}
  .chat-avatar.bot{background:linear-gradient(135deg,#0ea5e9,#06b6d4)}
  .chat-bubble-me{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border-radius:14px 14px 2px 14px;padding:10px 14px;max-width:80%;line-height:1.65}
  .chat-bubble-ai{background:#f1f5f9;color:#334155;border-radius:14px 14px 14px 2px;padding:10px 14px;max-width:85%;line-height:1.65}
  /* 聊天字号可调 */
  #chat-messages{font-size:var(--chat-fs,15px);line-height:1.7}
  #chat-messages .chat-bubble-me,#chat-messages .chat-bubble-ai{font-size:var(--chat-fs,15px);line-height:1.7}
  /* 聊天顶部字号工具条（仿微信） */
  .fs-toolbar{display:flex;align-items:center;gap:6px;background:#f8fafc;border-bottom:1px solid #f1f5f9;padding:7px 12px}
  .fs-toolbar .fs-tip{font-size:11px;color:#94a3b8;margin-right:4px}
  .fs-pill{display:flex;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:999px;overflow:hidden}
  .fs-pill button{width:28px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#475569;border:none;background:transparent;cursor:pointer;transition:.15s}
  .fs-pill button:hover{background:#f1f5f9;color:#0284c7}
  .fs-pill button:active{background:#e0f2fe}
  .fs-pill .fs-val{min-width:32px;text-align:center;font-size:12px;color:#64748b;border-left:1px solid #f1f5f9;border-right:1px solid #f1f5f9;line-height:26px}
  .fs-pill button.fs-active{background:#e0f2fe;color:#0369a1}
  .fs-toolbar-spacer{flex:1}
  .btn-clear-chat{font-size:11px;color:#94a3b8;background:transparent;border:none;cursor:pointer;padding:4px 8px;border-radius:6px}
  .btn-clear-chat:hover{color:#ef4444;background:#fef2f2}
  .sidebar-panel{width:340px;position:fixed;right:0;top:0;bottom:0;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.08);transform:translateX(100%);transition:transform .25s;z-index:40;display:flex;flex-direction:column;overscroll-behavior:contain}
  .sidebar-panel.open{transform:translateX(0)}
  /* 浮层内部滚动区禁止滚动穿透（手机端关键） */
  #chat-messages,.sidebar-panel .overflow-y-auto{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  /* 浮层打开时锁定 body 滚动，避免背后主页跟着动 */
  body.panel-open{overflow:hidden!important;position:fixed;width:100%}
  /* 聊天输入框支持拖拽调整大小 */
  #chat-input{resize:vertical;min-height:44px;max-height:200px;line-height:1.5;border-radius:22px;padding:11px 18px!important;overflow-y:auto;transition:height .1s}
  #chat-input::-webkit-scrollbar{width:4px}
  /* AI回复内加粗样式 */
  .chat-bubble-ai strong{font-weight:600;color:#0f172a}
  .chat-bubble-ai ul,.chat-bubble-ai ol{margin:4px 0;padding-left:20px}
  .chat-bubble-ai li{margin:2px 0;line-height:1.7}
  .chat-bubble-ai code{background:rgba(14,165,233,.08);padding:1px 6px;border-radius:4px;font-size:12px;color:#0369a1}
  /* 侧边栏拖拽手柄 */
  .sidebar-panel{transition:none;will-change:width}
  .sidebar-resize-handle{position:absolute;top:0;bottom:0;left:-4px;width:8px;cursor:ew-resize;z-index:50;background:transparent}
  .sidebar-resize-handle:hover{background:rgba(14,165,233,.15)}
  .sidebar-resize-handle.dragging{background:rgba(14,165,233,.3)}
  .sidebar-panel.open{transition:width .05s linear}
  .sidebar-panel:not(.open){transition:transform .25s}
  .day-content{white-space:pre-line;line-height:1.85}
  .fade-in{animation:fadeIn .25s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .cal-weekday{font-size:12px;color:#94a3b8;font-weight:500;text-align:center;padding:8px 0}
  .trip-card{background:linear-gradient(135deg,var(--tw-gradient-stops));border-radius:16px;padding:20px;color:#fff;box-shadow:0 4px 20px rgba(0,0,0,.08)}
  table{width:100%;border-collapse:collapse;margin:12px 0}
  th,td{border:1px solid #e2e8f0;padding:10px 12px;text-align:left;font-size:14px}
  th{background:#f8fafc;font-weight:600;color:#475569}
  .tab-btn{padding:10px 20px;border-radius:10px 10px 0 0;font-weight:500;cursor:pointer;transition:.15s;border-bottom:3px solid transparent}
  .tab-btn.active{background:#fff;color:#0284c7;border-bottom-color:#0284c7}
  .tab-btn:not(.active):hover{background:#f1f5f9}
  /* 地图飞行动画 */
  .flight-path{stroke-dasharray:8 4;animation:dash 20s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-240}}
  .plane-icon{animation:fly 20s linear infinite}
  @keyframes fly{0%{offset-distance:0%}100%{offset-distance:100%}}
  .map-pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{r:6;opacity:1}50%{r:12;opacity:0.4}}
  .map-glow{box-shadow:0 0 40px rgba(14,165,233,.15);border-radius:24px}
  /* 纯SVG地图容器样式 */
  #trip-map{height:400px;width:100%;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(180deg,#e0f2fe 0%,#bae6fd 100%)}
  #trip-map svg{width:100%;height:100%;display:block}
  .map-tooltip{position:absolute;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-radius:10px;padding:8px 12px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:5;pointer-events:none;transform:translate(-50%,-110%);white-space:nowrap;opacity:0;transition:opacity .15s;border-left:3px solid #0ea5e9}
  .map-tooltip.show{opacity:1}
  .map-tooltip b{color:#0369a1;display:block;margin-bottom:2px;font-size:13px}
  .map-legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
  .map-select-wrap{position:relative;z-index:2}
  .map-select{appearance:none;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px 34px 8px 14px;font-size:13px;color:#334155;cursor:pointer;font-weight:500;transition:.15s}
  .map-select:hover{border-color:#0ea5e9}
  .map-select:focus{outline:none;border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.12)}
  .map-select-wrap::after{content:'\f0d7';font-family:FontAwesome;position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;color:#94a3b8;pointer-events:none}
  .flight-info-badge{position:absolute;bottom:12px;left:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-radius:10px;padding:8px 14px;font-size:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);z-index:5;pointer-events:none}
  /* SVG轨迹互动 */
  .trail-line{cursor:pointer;transition:filter .2s,stroke-width .2s}
  .trail-line:hover{filter:drop-shadow(0 0 8px currentColor);stroke-width:4.5!important}
  .city-dot{cursor:pointer;transition:r .2s}
  .city-dot:hover{r:10!important}
  .city-label{pointer-events:none;font-size:13px;font-weight:600;fill:#1e293b}
  .city-label-sub{pointer-events:none;font-size:11px;fill:#64748b}
  .plane-icon{offset-rotate:auto;animation:flyAlong 20s linear infinite}
  @keyframes flyAlong{0%{offset-distance:0%}100%{offset-distance:100%}}
  .trail-flow{stroke-dasharray:6 12;animation:dashFlow 1.5s linear infinite}
  @keyframes dashFlow{to{stroke-dashoffset:-36}}
  .bay-dot{cursor:pointer;transition:r .2s,opacity .2s}
  .bay-dot:hover{r:8!important}
  .sea-pattern{opacity:.3}
  /* ===== 移动端适配 ===== */
  /* 汉堡按钮 */
  #btn-menu{display:none}
  /* 移动端顶部栏默认隐藏，仅手机显示 */
  .mobile-topbar{display:none}
  /* 抽屉遮罩 */
  .sidebar-mask{display:none}
  /* 响应式断点：手机端 ≤768px */
  @media (max-width:768px){
    body{overflow:auto!important}
    .flex.h-screen{flex-direction:column}
    /* 侧边栏改成抽屉 */
    aside.w-72{
      position:fixed;left:0;top:0;bottom:0;z-index:50;
      width:280px!important;
      transform:translateX(-100%);
      transition:transform .25s ease;
      padding-top:env(safe-area-inset-top);
      box-shadow:4px 0 20px rgba(0,0,0,.15);
    }
    aside.w-72.drawer-open{transform:translateX(0)}
    /* 遮罩 */
    .sidebar-mask{
      display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);
      z-index:45;opacity:0;pointer-events:none;transition:opacity .25s;
    }
    .sidebar-mask.show{opacity:1;pointer-events:auto}
    /* 顶部条（含汉堡按钮） */
    .mobile-topbar{
      display:flex;align-items:center;gap:10px;
      position:sticky;top:0;z-index:30;
      padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
      background:linear-gradient(135deg,#0ea5e9,#06b6d4);
      color:#fff;box-shadow:0 2px 10px rgba(2,132,199,.25);
    }
    #btn-menu{
      display:flex;align-items:center;justify-content:center;
      width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.2);
      border:none;color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;
    }
    #btn-menu:active{background:rgba(255,255,255,.35)}
    .mobile-title{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mobile-sub{font-size:11px;opacity:.8}
    /* 主内容区：移除溢出隐藏，允许滚动；缩小内边距 */
    main#main{overflow-y:visible!important;padding:14px!important;padding-bottom:calc(20px + env(safe-area-inset-bottom))!important}
    main#main>div{padding:0!important}
    /* 地图缩小高度 */
    #trip-map{height:240px!important;border-radius:14px}
    /* 顶部横幅缩小 */
    .px-10{padding-left:16px!important;padding-right:16px!important}
    .pt-10{padding-top:16px!important}
    .pb-6{padding-bottom:16px!important}
    .trip-card{padding:14px!important;border-radius:14px}
    .trip-card .text-xl{font-size:16px!important}
    .trip-card p{font-size:12px!important}
    /* 统计数字网格：从 4 列改 2 列 */
    .grid-cols-4{grid-template-columns:repeat(2,minmax(0,1fr))!important}
    /* 行程卡片网格：手机变单列 */
    .grid.grid-cols-1.md\:grid-cols-2.lg\:grid-cols-3{grid-template-columns:1fr!important}
    /* 首页欢迎区文字缩小 */
    .text-4xl{font-size:22px!important}
    .text-lg{font-size:15px!important}
    /* 日历：字号与单元格缩小 */
    .cal-cell{font-size:12px!important;border-radius:6px}
    .cal-weekday{font-size:10px;padding:4px 0}
    .grid-cols-7.gap-1{gap:2px!important}
    .cal-cell.has-trip::after{width:4px;height:4px;bottom:3px}
    /* 右侧抽屉面板（AI/用户中心）：手机占满宽度 */
    .sidebar-panel{width:100%!important}
    /* 悬浮按钮：缩小并挪位置，避免遮挡内容 */
    .fixed.bottom-6.right-6{bottom:14px!important;right:14px!important;gap:8px}
    .fixed.bottom-6.right-6 button{width:44px!important;height:44px!important;font-size:16px!important}
    /* 通用卡片内边距统一缩小 */
    .p-6{padding:14px!important}
    .p-5{padding:12px!important}
    .mb-6{margin-bottom:14px!important}
    .mb-4{margin-bottom:10px!important}
    .mt-8{margin-top:14px!important}
    .mt-4{margin-top:10px!important}
    .gap-4{gap:10px!important}
    .gap-3{gap:8px!important}
    /* 表格字号缩小，强制横向滚动兜底 */
    table{font-size:12px!important}
    th,td{padding:6px 8px!important}
    .overflow-x-auto{-webkit-overflow-scrolling:touch}
    /* 标题字号 */
    h2.text-xl{font-size:16px!important}
    .text-xl{font-size:16px!important}
    /* 标签页按钮 */
    .tab-btn{padding:8px 12px;font-size:13px}
    /* 地图底部信息条 */
    .flight-info-badge{font-size:10px;padding:6px 10px;left:8px;bottom:8px;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    /* 地图选择器和图例在手机上堆叠 */
    .flex.items-start.justify-between.mb-4{align-items:flex-start!important}
    .flex.items-start.justify-between.mb-4>div:last-child{
      flex-direction:column!important;align-items:flex-start!important;gap:6px!important;
      font-size:11px!important;width:100%
    }
    .map-select{font-size:12px;padding:6px 28px 6px 10px}
    /* 日详情页里的分时块缩小 */
    .day-content{font-size:13px;line-height:1.7}
    /* 聊天气泡缩窄 */
    .chat-bubble-me,.chat-bubble-ai{font-size:13px;max-width:85%!important;padding:8px 12px}
    #chat-input{font-size:13px!important;padding:8px 14px!important;min-height:40px;max-height:140px;border-radius:20px!important}
    .sidebar-panel{width:100%!important}
    #ai-resize{display:none}
    button,a{-webkit-tap-highlight-color:transparent}
  }
  /* 超小屏 ≤380px 进一步缩小 */
  @media (max-width:380px){
    .cal-cell{font-size:11px!important}
    #trip-map{height:200px!important}
    aside.w-72{width:260px!important}
  }
</style>
</head>
<body class="overflow-hidden">

<!-- 移动端抽屉遮罩 -->
<div class="sidebar-mask" id="sidebar-mask"></div>

<!-- 移动端顶部栏（汉堡按钮+标题） -->
<div class="mobile-topbar" id="mobile-topbar">
  <button id="btn-menu" aria-label="菜单"><i class="fa fa-bars"></i></button>
  <div style="flex:1;min-width:0">
    <div class="mobile-title">L.L的智能行程管家</div>
    <div class="mobile-sub">陪你走过每一段旅程</div>
  </div>
</div>

<div class="flex h-screen">
  <!-- 左侧导航栏 -->
  <aside class="w-72 bg-white border-r border-slate-200 flex flex-col shadow-sm">
    <div class="p-5 border-b border-slate-100 bg-gradient-to-br from-sky-500 to-cyan-500 text-white">
      <div class="flex items-center gap-2">
        <i class="fa fa-compass text-2xl"></i>
        <div>
          <div class="text-lg font-bold tracking-wide">L.L的智能行程管家</div>
          <div class="text-xs opacity-80 mt-0.5">陪你走过每一段旅程</div>
        </div>
      </div>
    </div>
    <div class="px-3 pt-3 pb-1 text-xs font-semibold text-slate-400 uppercase tracking-wider">视图</div>
    <div class="px-2">
      <div id="nav-home" class="nav-trip-item flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer text-sm">
        <i class="fa fa-calendar w-4 text-center"></i><span>行程日历</span>
      </div>
      <div id="nav-budget" class="nav-trip-item flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer text-sm">
        <i class="fa fa-pie-chart w-4 text-center"></i><span>预算管理</span>
      </div>
    </div>
    <div class="px-3 pt-4 pb-1 text-xs font-semibold text-slate-400 uppercase tracking-wider">我的行程</div>
    <div id="nav-trips" class="flex-1 overflow-y-auto scrollbar px-2 pb-4"></div>
  </aside>

  <!-- 主内容区 -->
  <main class="flex-1 overflow-y-auto scrollbar relative" id="main">
    <!-- 内容由JS渲染 -->
  </main>
</div>

<!-- 右下角悬浮按钮组 -->
<div class="fixed bottom-6 right-6 flex flex-col gap-3 z-30">
  <button id="btn-ai" class="w-14 h-14 rounded-full bg-gradient-to-br from-sky-500 to-cyan-500 text-white shadow-lg hover:shadow-xl flex items-center justify-center text-xl transition hover:scale-105" title="AI行程管家">
    <i class="fa fa-comments"></i>
  </button>
  <button id="btn-user" class="w-14 h-14 rounded-full bg-white border border-slate-200 text-slate-600 shadow-lg hover:shadow-xl flex items-center justify-center text-xl transition hover:scale-105" title="个人中心">
    <i class="fa fa-user-circle-o"></i>
  </button>
  <button id="btn-today" class="w-14 h-14 rounded-full bg-white border border-slate-200 text-slate-600 shadow-lg hover:shadow-xl flex items-center justify-center transition hover:scale-105" title="回到今天" style="font-size:12px;font-weight:600">今天</button>
</div>

<!-- AI管家侧边栏（支持拖拽调宽） -->
<div id="panel-ai" class="sidebar-panel">
  <div class="sidebar-resize-handle" id="ai-resize"></div>
  <div class="p-4 border-b border-slate-100 flex items-center justify-between relative z-10 bg-white">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-full bg-gradient-to-br from-sky-500 to-cyan-500 flex items-center justify-center text-white overflow-hidden" id="ai-header-avatar">
        <i class="fa fa-robot"></i>
      </div>
      <div>
        <div class="font-semibold text-slate-800" id="ai-header-name">AI行程管家</div>
        <div class="text-xs text-emerald-500">● 在线</div>
      </div>
    </div>
    <div class="flex items-center gap-1">
      <button class="close-panel text-slate-400 hover:text-slate-600 text-xl w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100"><i class="fa fa-times"></i></button>
    </div>
  </div>
  <!-- 聊天字号工具条（仿微信顶部样式） -->
  <div class="fs-toolbar">
    <span class="fs-tip"><i class="fa fa-font mr-1"></i>字号</span>
    <div class="fs-pill" id="fs-pill">
      <button data-fs="small" class="fs-tool-btn" title="小字号">A-</button>
      <span class="fs-val" id="fs-val">标准</span>
      <button data-fs="large" class="fs-tool-btn" title="大字号">A+</button>
    </div>
    <div class="fs-toolbar-spacer"></div>
    <span class="text-xs text-slate-400" id="fs-reset-hint">点击可恢复默认</span>
  </div>
  <div id="chat-messages" class="flex-1 overflow-y-auto scrollbar p-4 flex flex-col gap-3 bg-slate-50">
    <!-- 欢迎语由 JS 动态注入（头像/名称跟随设置） -->
  </div>
  <div class="p-3 border-t border-slate-100 flex gap-2 items-end">
    <button id="btn-clear-chat" class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 text-slate-400 hover:text-red-500 hover:bg-red-50" title="清空当前对话"><i class="fa fa-trash-o"></i></button>

<script>
// ============ 行程数据 ============
// ⚠️ 行程数据已抽离到 data/trips.json（唯一数据源），页面与后端共用。
// 下列变量在页面启动时由 loadTripData() 载入该文件后，再进行首次渲染。
let DAYS = {};

// 分时安排示例数据
let TIME_SCHEDULE = {};

// ============ 行程数据（数据驱动：未来AI新增行程只需往 TRIPS 里 push 一项，左侧导航、地图下拉、日历、预算会自动同步） ============
// 每个行程对象字段说明：
//   id          唯一ID，与左侧导航/data-act联动
//   name        行程名称（显示在左侧导航与下拉框）
//   start/end   起止日期 YYYY-MM-DD
//   cover       首页快捷入口卡片渐变色
//   desc        一句话描述
//   budget/spent 预算与已花费
//   fromCity/toCity  出发/目的地城市名（地图标签）
//   fromCoord/toCoord [lng,lat] 经纬度（地图定位用）
//   svgFrom/svgTo    {x,y} 在 SVG viewBox(0 0 900 380) 中的坐标，用于绘制航线
//   colorGo/colorRet 去程/返程航线颜色
//   flightGo/flightRet {no,time,info} 往返航班信息（tooltip显示）
//   route       途经点数组（可选，未来AI填充市内/多段路线，格式:[{point:'key',label:'xxx',days:'N晚',color:'#xxx'}]）
//   localRoute  目的地市内连线关键点key数组（可选，如三亚七湾环行）
//   dayKeys     该行程对应的 DAYS 对象键名前缀（如 "D1".."D40" 全部属于 syx-40d；未来新行程用 "E1".."E5" 等区分）
//   daysRef     指向该行程的每日详情数据（DAYS 对象），由AI填充

// ============ 每日详情数据（按行程归属，未来新增行程时在此添加新的 DAYS 对象，例如 DAYS_LUOYANG = {...}） ============

// SVG viewBox: 0 0 900 380，左下角海洋、右上角陆地；上海固定在右上，目的地按经度/纬度映射
// 映射规则：x = 经度 → (108~122 → 150~750)，y = 纬度 → (18~35 → 320~80)
function lngLatToSvg(lng,lat){
  const x = 150 + (lng-108)/(122-108) * 600;
  const y = 320 - (lat-18)/(35-18) * 240;
  return {x:Math.round(x),y:Math.round(y)};
}

let TRIPS = [];

// ============ 全局辅助：根据id取行程 ============
function getTrip(id){ return TRIPS.find(t=>t.id===id) || TRIPS[0]; }
function getCurrentTrip(){ return getTrip(state.selectedTripId); }

// 兼容旧代码中直接引用 TRIP 的地方（保持向后兼容，始终指向当前选中的行程）
Object.defineProperty(window,'TRIP',{get:()=>getCurrentTrip()});

// 预算数据（数据驱动：未来AI新增/调整支出，只需修改对应年份月份的金额并调用 render() 即可）
// 结构说明：
//   total / spent / trips / categories —— 全局汇总（保持向后兼容）
//   yearly —— 按年组织，每年含年度预算、12个月支出数组（索引0=1月，11=12月）
//            月份金额为0表示该月暂无计划支出，图表中以灰色占位柱显示
let BUDGET_DATA = {};

// ============ 全局状态 ============
let state = {
  view:'home',          // home | trip-overview | day | budget
  dayTab:'overview',    // overview | schedule （单日页的tab）
  selectedTripId:'',
  selectedDate:'',
  selectedDayKey:'',
  expandedTrip:null,
  calYear:2026,
  calMonth:12,
  userPanelOpen:false,
  aiPanelOpen:false,
  mapTripId:'__all__',  // 地图选中：'__all__'=全部行程；其他=某行程id
  budgetYear:2026       // 预算页当前选中的年度标签
};

// ============ 地图轨迹数据 ============
// 经纬度坐标 [lng, lat]
let MAP_POINTS = {};

// 七段行程轨迹：每段含 主路径line（湾区间换场）+ 当日活动点
let TRIP_SEGMENTS = [];

// 全程换湾路径（七段串联）
const FULL_BAY_ROUTE = ['airport','tianya','sanyawan','dadonghai','yalongwan','taiyangwan','haitangwan','qingshuiwan','sanyawan','airport'];

const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const weekdayNames=['日','一','二','三','四','五','六'];

// ============ 工具函数 ============
function parseDate(str){return new Date(str+'T00:00:00');}
function fmtDate(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function daysBetween(a,b){return Math.round((parseDate(b)-parseDate(a))/86400000)+1;}
function getTripStatus(trip){
  const today=new Date('2026-11-19T12:00:00');
  const s=parseDate(trip.start), e=parseDate(trip.end);
  if(today<s) return {key:'upcoming',label:'即将出发',days:Math.ceil((s-today)/86400000)};
  if(today>e) return {key:'past',label:'已完成',days:0};
  return {key:'ongoing',label:'正在进行',days:0};
}
function isDateInTrip(dateStr,trip){
  if(trip) return dateStr>=trip.start && dateStr<=trip.end;
  // 不传trip则判断是否在任意行程中
  return TRIPS.some(t=>dateStr>=t.start && dateStr<=t.end);
}
function findTripByDate(dateStr){
  return TRIPS.find(t=>dateStr>=t.start && dateStr<=t.end) || null;
}
function findDayByDate(dateStr){
  // 三亚行程
  for(const [key,d] of Object.entries(DAYS)){
    if(d.date===dateStr) return {key,...d,tripId:'syx-40d'};
  }
  // 未来其他行程的数据对象（AI接入后可扩展）：
  // if(window.DAYS_LUOYANG){ for(const [key,d] of Object.entries(DAYS_LUOYANG)){ if(d.date===dateStr) return {key,...d,tripId:'ly-x'}; } }
  return null;
}

// ============ 左侧导航渲染（数据驱动：遍历 TRIPS，未来新增行程自动出现） ============
function renderNav(){
  const navTrips=document.getElementById('nav-trips');
  let html='';
  TRIPS.forEach(trip=>{
    const status=getTripStatus(trip);
    const totalDays=daysBetween(trip.start,trip.end);
    const expanded = state.expandedTrip===trip.id;
    let daysList='';
    if(expanded && trip.id==='syx-40d'){
      // 三亚行程：展开显示40天（未来其他行程的days由AI注入时，可按 daysPrefix/dayStartIdx/dayEndIdx 自动生成）
      daysList=Object.entries(DAYS).map(([key,d])=>{
        const active = state.view==='day' && state.selectedDayKey===key && state.selectedTripId===trip.id ? 'active':'';
        return `<div class="nav-day-item ${active}" data-act="goto-day" data-trip="${trip.id}" data-key="${key}">
          <span><i class="fa fa-circle-o mr-2 text-xs text-sky-400"></i>${d.title}</span>
          <span class="text-xs text-slate-400">${d.day}</span>
        </div>`;
      }).join('');
    } else if(expanded && trip.id!=='syx-40d'){
      daysList=`<div class="px-3 py-2 text-xs text-slate-400">逐日安排由AI生成后自动展开</div>`;
    }
    const activeCls = (state.view==='trip-overview'&&state.selectedTripId===trip.id)
                   || (state.view==='day'&&state.selectedTripId===trip.id) ? 'active':'';
    html += `
      <div class="mb-2">
        <div class="nav-trip-item ${activeCls} flex items-center justify-between px-3 py-2.5 rounded-lg cursor-pointer text-sm" data-act="goto-trip" data-id="${trip.id}">
          <div class="flex items-center gap-3 overflow-hidden">
            <i class="fa fa-suitcase w-4 text-center flex-shrink-0"></i>
            <div class="truncate">
              <div class="truncate">${trip.name}</div>
              <div class="text-xs opacity-70">${trip.start.slice(5)} → ${trip.end.slice(5)} · ${totalDays}天</div>
            </div>
          </div>
          <i class="fa fa-chevron-${expanded?'down':'right'} text-xs flex-shrink-0" data-act="toggle-trip" data-id="${trip.id}"></i>
        </div>
        ${daysList}
      </div>`;
  });
  navTrips.innerHTML = html;

  // 绑定事件
  navTrips.querySelectorAll('[data-act="goto-trip"]').forEach(el=>{
    el.onclick=()=>{state.view='trip-overview';state.selectedTripId=el.dataset.id;render();};
  });
  navTrips.querySelectorAll('[data-act="goto-day"]').forEach(el=>{
    el.onclick=()=>{
      state.selectedTripId=el.dataset.trip;
      state.selectedDayKey=el.dataset.key;
      const d=DAYS[state.selectedDayKey];
      if(!d) return;
      state.selectedDate=d.date;
      const y=parseInt(d.date.slice(0,4)),m=parseInt(d.date.slice(5,7));
      state.calYear=y;state.calMonth=m;
      state.view='day';state.dayTab='overview';render();
    };
  });
  navTrips.querySelectorAll('[data-act="toggle-trip"]').forEach(el=>{
    el.onclick=(e)=>{e.stopPropagation();state.expandedTrip=state.expandedTrip===el.dataset.id?null:el.dataset.id;render();};
  });
  document.getElementById('nav-home').classList.toggle('active',state.view==='home');
  document.getElementById('nav-home').onclick=()=>{state.view='home';render();};
  document.getElementById('nav-budget').classList.toggle('active',state.view==='budget');
  document.getElementById('nav-budget').onclick=()=>{state.view='budget';render();};
}

// ============ 交互式轨迹地图（纯SVG无外部依赖 · 数据驱动 · 自动同步 TRIPS） ============
// 下拉选项：__all__ = 全部行程；其他 = 具体行程id（格式："上海 ↔ 三亚"）

// 贝塞尔航线（往返用不同弧度，形成"双箭头"效果）
function bezierPath(from,to,arcHeight=60,upward=true){
  const mx=(from.x+to.x)/2;
  const my=upward ? (from.y+to.y)/2 - arcHeight : (from.y+to.y)/2 + arcHeight;
  return `M${from.x},${from.y} Q${mx},${my} ${to.x},${to.y}`;
}

function selectMapView(id){
  state.mapTripId = id;
  render();
}

// 悬停提示 / 点击跳转
function showMapTip(ev,el){
  const tip = document.getElementById('map-tip');
  if(!tip) return;
  const rect = document.getElementById('trip-map').getBoundingClientRect();
  tip.innerHTML = el.dataset.tip;
  tip.style.left = (ev.clientX-rect.left)+'px';
  tip.style.top  = (ev.clientY-rect.top)+'px';
  tip.classList.add('show');
}
function hideMapTip(){
  const tip = document.getElementById('map-tip');
  if(tip) tip.classList.remove('show');
}

// 点击湾区节点 → 跳到该行程对应段首日
function jumpToBay(tripId, bayIdx){
  const trip = getTrip(tripId);
  if(!trip || !trip.bayStartDates || !trip.bayStartDates[bayIdx]) return;
  const dateStr = trip.bayStartDates[bayIdx];
  // 三亚行程使用 DAYS，未来其他行程由AI扩展
  if(trip.id==='syx-40d'){
    const dayKey = Object.keys(DAYS).find(k=>DAYS[k].date===dateStr);
    if(dayKey){
      state.selectedTripId=trip.id;
      state.selectedDayKey=dayKey;
      state.selectedDate=DAYS[dayKey].date;
      state.calYear=parseInt(DAYS[dayKey].date.slice(0,4));
      state.calMonth=parseInt(DAYS[dayKey].date.slice(5,7));
      state.view='day';state.dayTab='overview';
      render();
    }
  }
}

// 点击城市节点 → 跳转到该行程总览
function jumpToTripOverview(tripId){
  state.selectedTripId=tripId;
  state.view='trip-overview';
  render();
}

// 计算地图viewBox的自适应范围（聚焦到某一/几个行程）
function calcMapViewBox(trips){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  const expand=40;
  trips.forEach(t=>{
    [{x:t.svgFrom.x,y:t.svgFrom.y},{x:t.svgTo.x,y:t.svgTo.y}].forEach(p=>{
      if(p.x<minX)minX=p.x;if(p.y<minY)minY=p.y;
      if(p.x>maxX)maxX=p.x;if(p.y>maxY)maxY=p.y;
    });
    (t.localPts||[]).forEach(pt=>{
      if(pt.coord.x<minX)minX=pt.coord.x;if(pt.coord.y<minY)minY=pt.coord.y;
      if(pt.coord.x>maxX)maxX=pt.coord.x;if(pt.coord.y>maxY)maxY=pt.coord.y;
    });
  });
  // 计算缩放（保持 viewBox 宽高比 900:380 ≈ 2.368）
  let w = maxX - minX + expand*2;
  let h = maxY - minY + expand*2;
  const targetRatio = 900/380;
  if(w/h > targetRatio){ h = w/targetRatio; }
  else { w = h*targetRatio; }
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  return {x:cx-w/2, y:cy-h/2, w, h};
}

function renderMapTrail(){
  const sel = state.mapTripId || '__all__';
  const showAll = sel==='__all__';
  const selectedTrip = showAll ? null : getTrip(sel);
  const tripsToRender = showAll ? TRIPS : [selectedTrip];

  // 下拉选项：全部 + 每个行程一个（"上海 ↔ 三亚"）
  const selectOptions = [
    `<option value="__all__" ${showAll?'selected':''}>全部行程</option>`,
    ...TRIPS.map(t=>`<option value="${t.id}" ${sel===t.id?'selected':''}>${t.fromCity} ↔ ${t.toCity} · ${t.name.split('·')[0].trim()}</option>`)
  ].join('');

  // 自适应viewBox
  const vb = calcMapViewBox(tripsToRender);

  // 底部信息条文本
  let infoText = '';
  if(showAll){
    const totalDays = TRIPS.reduce((s,t)=>s+daysBetween(t.start,t.end),0);
    infoText = `<i class="fa fa-exchange text-sky-500 mr-1"></i> 共 ${TRIPS.length} 段行程 · 合计 ${totalDays} 天 &nbsp;|&nbsp; <i class="fa fa-map-marker text-sky-500 mr-1"></i> 下拉切换查看单段轨迹`;
  } else {
    const totalDays = daysBetween(selectedTrip.start,selectedTrip.end);
    infoText = `<i class="fa fa-plane" style="color:${selectedTrip.colorGo};margin-right:4px"></i> <b>${selectedTrip.fromCity} ↔ ${selectedTrip.toCity}</b> &nbsp;|&nbsp; ${selectedTrip.flightGo.no} · ${selectedTrip.flightGo.time} &nbsp;|&nbsp; ${totalDays}天 · ${(selectedTrip.localPts||[]).length}处停留`;
  }

  // 图例
  let legendHtml = '';
  tripsToRender.forEach(t=>{
    if(!showAll && tripsToRender.length===1){
      legendHtml = `<span><span class="map-legend-dot" style="background:${t.colorGo}"></span>去程</span>
                    <span><span class="map-legend-dot" style="background:${t.colorRet}"></span>返程</span>
                    <span><span class="map-legend-dot" style="background:#0ea5e9"></span>当地路线</span>`;
    } else {
      legendHtml += `<span><span class="map-legend-dot" style="background:${t.colorGo}"></span>${t.fromCity}→${t.toCity}</span>`;
    }
  });

  // 统计数字（全部=汇总；单选=该行程）
  let statFly, statDays, statStays, statKm;
  if(showAll){
    statFly = TRIPS.length+'段';
    statDays = TRIPS.reduce((s,t)=>s+daysBetween(t.start,t.end),0);
    statStays = TRIPS.reduce((s,t)=>s+(t.localPts?.length||0),0)+'处';
    statKm = '多程';
  } else {
    statFly = selectedTrip.flightGo.info.replace('飞行约','');
    statDays = daysBetween(selectedTrip.start,selectedTrip.end);
    statStays = (selectedTrip.localPts?.length||0)+'处停留';
    statKm = '≈2000km';
  }

  // ============ 绘制SVG内容 ============
  let svgContent = '';

  // defs
  svgContent += `<defs>
    <pattern id="sea" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0,20 Q10,15 20,20 T40,20" stroke="#7dd3fc" stroke-width="1" fill="none" opacity=".4"/>
      <path d="M0,32 Q10,27 20,32 T40,32" stroke="#7dd3fc" stroke-width="1" fill="none" opacity=".3"/>
    </pattern>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/><stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>`;
  // 为每个行程生成去程/返程动画路径 + 箭头
  tripsToRender.forEach((t,i)=>{
    const goP = bezierPath(t.svgFrom,t.svgTo,60,true);
    const retP = bezierPath(t.svgTo,t.svgFrom,90,false);
    svgContent += `<path id="go-path-${t.id}" d="${goP}" fill="none"/>
                   <path id="ret-path-${t.id}" d="${retP}" fill="none"/>
                   <marker id="arrow-go-${t.id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                     <path d="M0,0 L10,5 L0,10 z" fill="${t.colorGo}"/>
                   </marker>
                   <marker id="arrow-ret-${t.id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                     <path d="M0,0 L10,5 L0,10 z" fill="${t.colorRet}"/>
                   </marker>`;
  });
  svgContent += `</defs>`;

  // 背景：海洋
  svgContent += `<rect x="0" y="0" width="900" height="380" fill="url(#sea)"/>`;

  // 简化陆地轮廓（中国东南沿海示意）— 只在showAll或目的地位于该区域时显示
  svgContent += `<path d="M0,40 Q120,20 200,60 Q280,80 350,50 Q450,20 550,30 Q650,40 720,60 Q780,75 830,60 L900,50 L900,0 L0,0 Z" fill="url(#land)" opacity=".6"/>
                 <path d="M100,280 Q160,260 200,240 Q260,220 320,230 Q380,245 450,300 Q520,350 600,360 L900,380 L900,380 L0,380 L0,320 Q50,300 100,280Z" fill="url(#land)" opacity=".5"/>`;

  // 海南岛（当选中三亚或全部时显示）
  const showHainan = showAll || tripsToRender.some(t=>t.id==='syx-40d');
  if(showHainan){
    svgContent += `<ellipse cx="280" cy="280" rx="180" ry="80" fill="#d1fae5" opacity=".8"/>`;
  }

  // 省名装饰（showAll时显示）
  if(showAll){
    svgContent += `<text x="600" y="60" class="city-label-sub" opacity=".5">浙江省</text>
                   <text x="500" y="140" class="city-label-sub" opacity=".5">福建省</text>
                   <text x="350" y="200" class="city-label-sub" opacity=".5">广东省</text>`;
  }
  if(showHainan){
    svgContent += `<text x="280" y="220" class="city-label-sub" font-weight="600" fill="#059669">海南岛</text>`;
  }

  // ========== 绘制每个行程的航线+节点 ==========
  tripsToRender.forEach((t,i)=>{
    const goP = bezierPath(t.svgFrom,t.svgTo,60,true);
    const retP = bezierPath(t.svgTo,t.svgFrom,90,false);
    const isSolo = !showAll;

    // 去程航线
    svgContent += `<path d="${goP}" fill="none" stroke="${t.colorGo}" stroke-width="${isSolo?2.8:2}" stroke-dasharray="8 5" class="trail-line trail-flow" style="color:${t.colorGo};opacity:.9" marker-end="url(#arrow-go-${t.id})"
          data-tip="<b>${t.fromCity} → ${t.toCity}</b><br>${t.flightGo.no} · ${t.flightGo.time}<br>${t.flightGo.info}" onmouseenter="showMapTip(event,this)" onmouseleave="hideMapTip()"/>`;
    // 返程航线
    svgContent += `<path d="${retP}" fill="none" stroke="${t.colorRet}" stroke-width="${isSolo?2.8:2}" stroke-dasharray="8 5" class="trail-line trail-flow" style="color:${t.colorRet};opacity:.85;animation-delay:-.75s" marker-end="url(#arrow-ret-${t.id})"
          data-tip="<b>${t.toCity} → ${t.fromCity}</b><br>${t.flightRet.no} · ${t.flightRet.time}<br>${t.flightRet.info}" onmouseenter="showMapTip(event,this)" onmouseleave="hideMapTip()"/>`;
    // 飞机图标（沿去程飞）
    svgContent += `<g class="plane-icon" style="offset-path:path('${goP}');">
          <text font-size="${isSolo?20:16}" fill="${t.colorGo}" text-anchor="middle" dominant-baseline="middle">✈</text>
        </g>`;
    // 飞机图标（返程反方向）
    svgContent += `<g class="plane-icon" style="offset-path:path('${retP}');animation-delay:-10s">
          <text font-size="${isSolo?20:16}" fill="${t.colorRet}" text-anchor="middle" dominant-baseline="middle" transform="rotate(180)">✈</text>
        </g>`;

    // 出发城市节点
    svgContent += `<circle cx="${t.svgFrom.x}" cy="${t.svgFrom.y}" r="${isSolo?8:7}" fill="${t.colorGo}" stroke="#fff" stroke-width="3" class="city-dot"
            data-tip="<b>${t.fromCity}·${t.fromSub}</b><br>${t.fromCity}→${t.toCity} 出发地"
            onmouseenter="showMapTip(event,this)" onmouseleave="hideMapTip()"
            onclick="jumpToTripOverview('${t.id}')"/>
        <text x="${t.svgFrom.x+12}" y="${t.svgFrom.y+5}" class="city-label">${t.fromCity}</text>
        <text x="${t.svgFrom.x+12}" y="${t.svgFrom.y+20}" class="city-label-sub">${t.fromSub}</text>`;

    // 目的地节点
    svgContent += `<circle cx="${t.svgTo.x}" cy="${t.svgTo.y}" r="${isSolo?8:7}" fill="${t.colorRet}" stroke="#fff" stroke-width="3" class="city-dot"
            data-tip="<b>${t.toCity}·${t.toSub}</b><br>抵达/返程起飞点"
            onmouseenter="showMapTip(event,this)" onmouseleave="hideMapTip()"
            onclick="jumpToTripOverview('${t.id}')"/>
        <text x="${t.svgTo.x+12}" y="${t.svgTo.y+5}" class="city-label" fill="#059669">${t.toCity}</text>
        <text x="${t.svgTo.x+12}" y="${t.svgTo.y+20}" class="city-label-sub">${t.toSub}</text>`;

    // 当地市内连线 + 停留点（仅单选该行程或三亚行程时显示细节）
    if(isSolo && t.localPts && t.localPts.length>0){
      // 构造本地路线点
      const ptMap = {};
      t.localPts.forEach(p=>ptMap[p.key]=p.coord);
      ptMap['AIRPORT']=t.svgTo;
      const routePts = t.localRoute.map(k=>ptMap[k]).filter(Boolean);
      if(routePts.length>=2){
        const localPath = routePts.map((p,i)=> (i===0?'M':'L')+p.x+','+p.y).join(' ');
        svgContent += `<path d="${localPath}" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="trail-line" style="color:#0ea5e9;opacity:.75"
                data-tip="<b>${t.toCity}市内路线</b><br>${t.localPts.map(p=>p.label).join(' → ')}"
                onmouseenter="showMapTip(event,this)" onmouseleave="hideMapTip()"/>`;
      }
      // 停留点
      t.localPts.forEach((p,idx)=>{
        svgContent += `<circle cx="${p.coord.x}" cy="${p.coord.y}" r="7" fill="${p.color}" stroke="#fff" stroke-width="2.5" class="bay-dot"
                data-tip="<b>${p.label}</b><br>${p.days?'停留 '+p.days:''}"
                onmouseenter="showMapTip(event,this)" onmouseleave="hideMapTip()"
                onclick="jumpToBay('${t.id}',${idx})"/>
            <text x="${p.coord.x}" y="${p.coord.y-12}" text-anchor="middle" class="city-label-sub" fill="${p.color}" font-weight="600" style="font-size:11px">${p.label}</text>`;
      });
    }
  });

  // 指南针
  svgContent += `<g transform="translate(${Math.min(vb.x+vb.w-30,860)},${Math.max(vb.y+30,30)})" opacity=".5">
      <circle r="14" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
      <text text-anchor="middle" y="-4" font-size="10" fill="#ef4444" font-weight="700">N</text>
      <polygon points="0,-12 3,0 0,-3 -3,0" fill="#ef4444"/>
      <polygon points="0,12 3,0 0,3 -3,0" fill="#94a3b8"/>
    </g>`;

  return `
  <div class="bg-white rounded-2xl shadow-sm p-6 mb-6" style="box-shadow:0 0 40px rgba(14,165,233,.12);border-radius:24px">
    <div class="flex items-start justify-between mb-4 flex-wrap gap-3">
      <div>
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2"><i class="fa fa-map text-sky-500"></i>出行轨迹地图</h2>
        <div class="text-xs text-slate-400 mt-1">下拉切换行程 · 往返双箭头航线 · 悬停查看详情 · 点击节点跳转</div>
      </div>
      <div class="flex items-center gap-3 flex-wrap">
        <div class="map-select-wrap">
          <select id="map-select" class="map-select" onchange="selectMapView(this.value)">
            ${selectOptions}
          </select>
        </div>
        <div class="flex items-center gap-3 text-xs text-slate-500">
          ${legendHtml}
        </div>
      </div>
    </div>

    <div id="trip-map">
      <svg viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        ${svgContent}
      </svg>
      <div id="map-tip" class="map-tooltip"></div>
      <div class="flight-info-badge">${infoText}</div>
    </div>

    <div class="grid grid-cols-4 gap-3 mt-4">
      <div class="text-center p-3 bg-sky-50 rounded-xl">
        <div class="text-xl font-bold text-sky-600">${showAll?TRIPS.length+'段':statFly}</div>
        <div class="text-xs text-slate-500 mt-0.5">${showAll?'总行程数':'单程飞行'}</div>
      </div>
      <div class="text-center p-3 bg-cyan-50 rounded-xl">
        <div class="text-xl font-bold text-cyan-600">${statDays}天</div>
        <div class="text-xs text-cyan-500 mt-0.5">${showAll?'合计天数':'行程天数'}</div>
      </div>
      <div class="text-center p-3 bg-teal-50 rounded-xl">
        <div class="text-xl font-bold text-teal-600">${statStays}</div>
        <div class="text-xs text-teal-500 mt-0.5">${showAll?'覆盖停留':'停留点'}</div>
      </div>
      <div class="text-center p-3 bg-emerald-50 rounded-xl">
        <div class="text-xl font-bold text-emerald-600">${showAll?'多程':statKm}</div>
        <div class="text-xs text-emerald-500 mt-0.5">${showAll?'航线网络':'飞行距离'}</div>
      </div>
    </div>
  </div>`;
}

function formatContent(text){
  // 简单格式化：识别地点块、项目符号、段落
  let html='';
  const paras=text.split('\n\n');
  paras.forEach(p=>{
    p=p.trim();
    if(!p) return;
    if(p.startsWith('📍')){
      const lines=p.split('\n');
      const title=lines[0].replace('📍','').trim();
      html+=`<div class="my-4 bg-sky-50 border-l-4 border-sky-400 rounded-r-xl p-4"><div class="font-semibold text-sky-700 mb-1"><i class="fa fa-map-marker mr-1"></i>${title}</div><div class="text-sm text-slate-600">${lines.slice(1).join('<br>')}</div></div>`;
    }else if(p.startsWith('今晚住宿推荐')){
      const lines=p.split('\n');
      html+=`<div class="my-4 bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-4"><div class="font-semibold text-amber-700 mb-2"><i class="fa fa-bed mr-1"></i>${lines[0]}</div><div class="space-y-2">`;
      lines.slice(1).forEach(l=>{
        if(l.trim().startsWith('•')) html+=`<div class="text-sm text-slate-700 pl-3 border-l-2 border-amber-200">${l.replace(/^•/,'').trim()}</div>`;
        else if(l.includes('·')) html+=`<div class="text-sm text-slate-700">${l}</div>`;
      });
      html+=`</div></div>`;
    }else if(p.startsWith('•')){
      const items=p.split('\n').map(l=>`<li class="mb-1">${l.replace(/^•/,'').trim()}</li>`).join('');
      html+=`<ul class="list-disc pl-5 my-3 space-y-1 text-slate-700">${items}</ul>`;
    }else{
      html+=`<p class="my-3">${p.replace(/\n/g,'<br>')}</p>`;
    }
  });
  return html;
}

// 根据面板宽度计算适配字号（宽度越宽 → 字号略大）
function getAdaptiveFontSize(){
  const base = FS_PRESETS[chatPrefs.fontSizeLevel] || 15;
  const panel = document.getElementById('panel-ai');
  if(!panel || window.matchMedia('(max-width:768px)').matches) return base; // 手机端固定

  // 默认340px对应base；拉到640px时+2px
  let extra = 0;
  if(w > 440) extra = 1;
  if(w > 540) extra = 2;
  return base + extra;
}

// 流式解析SSE响应
async function parseSSEStream(response, onChunk) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop(); // 最后一行可能不完整，留到下次

    for (const line of lines) {
      const trimmedLine = line.trim();
      if (!trimmedLine || trimmedLine === 'data: [DONE]') continue;
      if (trimmedLine.startsWith('data: ')) {
        try {
          const data = JSON.parse(trimmedLine.slice(6));
          const content = data.choices?.[0]?.delta?.content || '';
          if (content) onChunk(content);
        } catch (e) {
          // 忽略解析错误，继续处理下一行
        }
      }
    }
  }
}

async function sendChat(){
  if (isAIReplying) return; // 防止重复提交

  const input=document.getElementById('chat-input');
  const msg=input.value.trim();if(!msg) return;
  const box=document.getElementById('chat-messages');
  
  // 添加用户消息（带头像）
  box.innerHTML+=renderRow('user', msg);
  chatHistory.push({ role: 'user', content: msg });
  input.value='';
  box.scrollTop=box.scrollHeight;

  // 添加AI思考中提示
  isAIReplying = true;
  const thinkingId = 'thinking-' + Date.now();
  box.innerHTML += renderRow('ai', '<i class="fa fa-circle-o-notch fa-spin mr-2"></i>AI思考中...', thinkingId);
  box.scrollTop = box.scrollHeight;

  try {
    // 收集当前行程上下文
    const tripContext = {
      currentTrip: getCurrentTrip(),
      currentView: state.view,
      currentDay: state.selectedDayKey ? DAYS[state.selectedDayKey] : null,
    };

    // 调用后端API
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        messages: chatHistory,
        tripContext: tripContext,
      }),
    });

    if (!response.ok) {
      // 优先读取后端返回的中文提示（限流 429 / 过长 413 / 来源拦截 403 等）
      let serverMsg = '';
      try {
        const errData = await response.json();
        serverMsg = errData && errData.error ? String(errData.error) : '';
      } catch (e) { /* 非 JSON 响应，忽略 */ }
      const err = new Error(serverMsg || `API请求失败: ${response.status}`);
      err.status = response.status;
      err.friendly = serverMsg;
      throw err;
    }

    // 移除思考提示整行（包含头像+气泡），开始流式输出
    const thinkingBubble = document.getElementById(thinkingId);
    const thinkingRow = thinkingBubble ? thinkingBubble.closest('.chat-row') : null;
    const aiBubbleId = 'ai-reply-' + Date.now();
    if (thinkingRow) thinkingRow.remove();

    box.innerHTML += renderRow('ai', '', aiBubbleId);
    const aiBubble = document.getElementById(aiBubbleId);
    let fullReply = '';

    // 处理流式响应
    await parseSSEStream(response, (chunk) => {
      fullReply += chunk;
      // 简单Markdown解析：**加粗**、- 列表、换行
      let html = fullReply
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^[-•]\s+(.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
      // 合并连续ul
      html = html.replace(/<\/ul>\s*<ul>/g, '');
      aiBubble.innerHTML = html.replace(/\n/g, '<br>');
      box.scrollTop = box.scrollHeight;
    });

    // 保存完整回复到历史
    chatHistory.push({ role: 'assistant', content: fullReply });

    // 限制历史长度，最多保留20条消息
    if (chatHistory.length > 20) {
      chatHistory = chatHistory.slice(-20);
    }

  } catch (error) {
    console.error('Chat error:', error);
    const thinkingEl = document.getElementById(thinkingId);
    if (thinkingEl) {
      // 后端返回的友好提示（如限流、消息过长）原样展示；网络类错误才给通用提示
      if (error && error.friendly) {
        thinkingEl.innerHTML = `<i class="fa fa-info-circle text-amber-500 mr-2"></i>${error.friendly}`;
      } else {
        thinkingEl.innerHTML = `<i class="fa fa-exclamation-circle text-red-500 mr-2"></i>连接失败，请稍后重试。<br><small class="text-slate-400">提示：请先在Vercel环境变量中配置DEEPSEEK_API_KEY，API地址：https://platform.deepseek.com/</small>`;
      }
    }
  } finally {
    isAIReplying = false;
    box.scrollTop = box.scrollHeight;
  }
}

// 手机端：右滑关闭浮层（AI面板 / 个人中心通用）
// - 触发区从屏幕左边缘 45px 起，足够宽好操作，又不会干扰正常上下滚动
// - 手指滑动时面板跟着手指右移，越过 1/3 屏宽自动关闭，否则弹回
(function(){
  const EDGE = 45;             // 左边缘触发宽度（px）
  const TRIGGER_RATIO = 0.33;  // 滑过面板宽度的 1/3 触发关闭
  let sx=0, sy=0, tracking=false, curPanel=null, startTransform='', startLeft=0;

  function activePanel(){
    const ai=document.getElementById('panel-ai');
    const us=document.getElementById('panel-user');
    if(ai.classList.contains('open')) return ai;
    if(us.classList.contains('open')) return us;
    return null;
  }

  document.addEventListener('touchstart',e=>{
    if(window.matchMedia('(min-width:769px)').matches) return;
    const p = activePanel();
    if(!p) return;
    // 输入框聚焦时不拦截，避免影响打字
    if(document.activeElement && (document.activeElement.id==='chat-input' || document.activeElement.tagName==='INPUT' || document.activeElement.tagName==='TEXTAREA')){
      // 仍在边缘才追踪，输入框内部点击不拦截
      const t=e.touches[0];
      if(t.clientX > EDGE) return;
    }
    const t=e.touches[0];
    const rect=p.getBoundingClientRect();
    // 手指起点在面板左边缘往左 45px 内（即屏幕最左边缘 45px）
    if(t.clientX <= rect.left + EDGE){
      sx=t.clientX; sy=t.clientY; tracking=true; curPanel=p;
      curPanel.style.transition='none';
      // 去掉 transform 类以允许跟手
    }
  },{passive:true});

  document.addEventListener('touchmove',e=>{
    if(!tracking||!curPanel) return;
    const t=e.touches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    // 只有当水平位移大于垂直位移时才进入跟手，避免上下滚动误触发
    if(Math.abs(dx) < Math.abs(dy)){ return; }
    if(dx <= 0){ // 往左滑不动
      curPanel.style.transform='translateX(0)';
      return;
    }
    const panelW = curPanel.offsetWidth;
    // 跟手移动：dx 越大越向右（被滑走），面板自身是从右边缘滑入的，所以要向右translate
    curPanel.style.transform=`translateX(${dx}px)`;
  },{passive:true});

  document.addEventListener('touchend',e=>{
    if(!tracking||!curPanel){ tracking=false;curPanel=null;return; }
    const t=e.changedTouches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    const panelW = curPanel.offsetWidth;
    curPanel.style.transition='transform .22s cubic-bezier(.4,0,.2,1)';
    // 横向为主 且 滑过 1/3 宽度 → 关闭
    if(Math.abs(dx) > Math.abs(dy)*1.2 && dx > panelW*TRIGGER_RATIO){
      curPanel.style.transform=`translateX(${panelW}px)`;
      setTimeout(()=>{ closePanels(); curPanel.style.transform=''; curPanel.style.transition=''; },220);
    }else{
      // 回弹
      curPanel.style.transform='translateX(0)';
      setTimeout(()=>{ curPanel.style.transition=''; },220);
    }
    tracking=false;curPanel=null;
  },{passive:true});
})();

// 手机端：阻止聊天区滚动穿透到背后主页
(function(){
  const box=document.getElementById('chat-messages');
  if(!box) return;
  let startY=0;
  box.addEventListener('touchstart',e=>{ startY=e.touches[0].clientY; },{passive:true});
  box.addEventListener('touchmove',e=>{
    const el=e.currentTarget;
    const atTop = el.scrollTop<=0;
    const atBottom = el.scrollTop+el.clientHeight>=el.scrollHeight-1;
    const dy=e.touches[0].clientY-startY;
    // 顶部继续下拽 或 底部继续上推 时阻止默认，避免带动 body
    if((atTop && dy>0) || (atBottom && dy<0)) e.preventDefault();
  },{passive:false});
  // 兜底：面板打开时，禁止其内部除可滚动区外的触摸滚动外溢
  document.getElementById('panel-ai').addEventListener('touchmove',e=>{
    if(e.target.closest('#chat-messages')||e.target.closest('#chat-input')||e.target.closest('#ai-settings')) return;
    e.preventDefault();
  },{passive:false});
})();

// AI侧边栏拖拽调宽（拖拽时实时自适应字号）
(function(){
  const panel=document.getElementById('panel-ai');
  const handle=document.getElementById('ai-resize');
  let isDragging=false,startX=0,startW=0;
  let rafId=null;
  function refreshFs(){ if(panel.classList.contains('open')) applyPrefs(); }
  handle.addEventListener('mousedown',e=>{
    isDragging=true;startX=e.clientX;startW=panel.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.userSelect='none';
    e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!isDragging)return;
    const w=Math.max(300,Math.min(640,startW-(e.clientX-startX)));
    panel.style.width=w+'px';
    // 拖拽时用requestAnimationFrame节流，实时同步字号
    if(!rafId){ rafId=requestAnimationFrame(()=>{ rafId=null; refreshFs(); }); }
  });
  document.addEventListener('mouseup',()=>{
    if(isDragging){
      isDragging=false;handle.classList.remove('dragging');
      document.body.style.userSelect='';
      refreshFs();
      const box=document.getElementById('chat-messages');
      if(box)box.scrollTop=box.scrollHeight;
    }
  });
  // 打开面板/窗口尺寸变化时，重算字号（桌面端宽度切换）
  const origOpen = window.openAI;
  window.openAI = function(){ origOpen(); setTimeout(refreshFs,50); };
  window.addEventListener('resize',()=>{
    if(window.matchMedia('(max-width:768px)').matches){
      panel.style.width=''; // 手机端强制满宽
    }
    refreshFs();
  });
})();

// ============ AI 接入说明（给未来对接 AI 模块时参考） ============
//
// 1. 新增行程：AI生成新行程后，只要构造一个符合 TRIPS 数组元素格式的对象
//    （字段参照上方"上海→洛阳"注释模板），执行：

//    预算页"按行程统计"图表自动追加一项（需同步 push BUDGET_DATA.trips）。
//
// 2. 地图坐标：目的地的 svgTo 可直接调用 lngLatToSvg(lng,lat) 自动算位置，

//    window.DAYS_XXXX = { "E1 xx/xx":{date,weekday,day:"E1",title,content}, ... }
//    并在 findDayByDate 里增加对应的查找分支（上方已留注释占位），
//    再把该行程的 id 判断分支加到 renderNav 的 expanded 逻辑里即可。

//    - 更新某月支出：BUDGET_DATA.yearly[2027].months[2] = 80000;  // 索引0=1月，2=3月
//    - 修改年度预算：BUDGET_DATA.yearly[2027].yearBudget = 1200000;

// =============== 移动端抽屉交互 ===============
(function(){
  const sidebar = document.querySelector('aside.w-72');
  const mask = document.getElementById('sidebar-mask');
  const menuBtn = document.getElementById('btn-menu');
  if(!sidebar || !mask || !menuBtn) return;

  const EDGE = 45;          // 触发区域：屏幕左边缘 45px 内
  const TRIGGER_RATIO = 0.3; // 滑过面板 30% 宽度 → 切换开关
  let sx=0, sy=0, tracking=false, trackingDirection=null; // 'open'/'close'/null

  function openDrawer(){
    sidebar.classList.add('drawer-open');
    mask.classList.add('show');
    document.body.style.overflow='hidden';
  }
  function closeDrawer(){
    sidebar.classList.remove('drawer-open');
    mask.classList.remove('show');
    document.body.style.overflow='';
  }
  function isDrawerOpen(){ return sidebar.classList.contains('drawer-open'); }
  function isMobile(){ return window.matchMedia('(max-width:768px)').matches; }
  function isPanelOpen(){
    return document.getElementById('panel-ai').classList.contains('open') ||
           document.getElementById('panel-user').classList.contains('open');
  }

  menuBtn.onclick = ()=>{
    if(isDrawerOpen()) closeDrawer();
    else openDrawer();
  };
  mask.onclick = closeDrawer;

  // 点击侧边栏里的导航项（视图切换/行程切换）后自动关闭抽屉
  sidebar.addEventListener('click',(e)=>{
    if(!isMobile()) return;
    const item = e.target.closest('.nav-trip-item, .nav-day-item, [data-act="goto-trip"], [data-act="goto-day"], #nav-home, #nav-budget');
    if(item){ setTimeout(closeDrawer,150); }
  });

  // 桌面变宽时自动关抽屉
  window.addEventListener('resize',()=>{
    if(!isMobile()) closeDrawer();
  });

  // 点右下角"今天"按钮自动滚到顶部（手机）
  const btnToday = document.getElementById('btn-today');
  if(btnToday){
    btnToday.addEventListener('click',()=>{
      if(isMobile()){
        setTimeout(()=>{ window.scrollTo({top:0,behavior:'smooth'}); },50);
      }
    });
  }

  // ===== 左右滑手势：右滑拉出 / 左滑收进 =====
  document.addEventListener('touchstart',e=>{
    if(!isMobile()) return;
    // AI面板/个人中心打开时，优先让它们的手势处理，避免冲突
    if(isPanelOpen()) return;
    const t = e.touches[0];
    sx = t.clientX; sy = t.clientY;
    tracking = false; trackingDirection = null;
    sidebar.style.transition = 'none';
  },{passive:true});

  document.addEventListener('touchmove',e=>{
    if(!isMobile()) return;
    if(isPanelOpen()) return;
    const t = e.touches[0];
    const dx = t.clientX - sx;
    const dy = t.clientY - sy;

    // 首次判定方向：只有水平为主才进入跟手
    if(!tracking){
      if(Math.abs(dx) < Math.abs(dy)) return; // 垂直滚动不拦截
      // 两种场景：
      //  1) 抽屉关闭，手指起点在左边缘 EDGE 内，且向右滑 → 拉出
      //  2) 抽屉打开，手指起点在侧边栏内（或右侧遮罩区），且向左滑 → 收起
      if(!isDrawerOpen() && sx <= EDGE && dx > 0){
        tracking = true; trackingDirection = 'open';
        sidebar.classList.add('drawer-open'); // 提前挂上类以便 transform 生效
        sidebar.style.transform = `translateX(calc(-100% + ${dx}px))`;
        mask.style.transition='none';
        mask.style.opacity = Math.min(dx / (sidebar.offsetWidth * TRIGGER_RATIO * 2), 1);
        document.body.style.overflow='hidden';
      }else if(isDrawerOpen() && dx < 0 && t.clientX >= sidebar.getBoundingClientRect().left){
        tracking = true; trackingDirection = 'close';
        sidebar.style.transform = `translateX(${dx}px)`;
        const prog = 1 - Math.abs(dx)/sidebar.offsetWidth;
        mask.style.transition='none';
        mask.style.opacity = Math.max(prog,0);
      }
      return;
    }

    // 正在跟手
    if(trackingDirection === 'open'){
      // 向右拉出：translateX 从 -100% → 0
      sidebar.style.transform = `translateX(calc(-100% + ${Math.max(0,dx)}px))`;
      mask.style.opacity = Math.min(Math.max(0,dx) / sidebar.offsetWidth, 1);
      if(dx < 0){ sidebar.style.transform='translateX(-100%)'; }
    }else if(trackingDirection === 'close'){
      // 向左收起：translateX 从 0 → -100%
      sidebar.style.transform = `translateX(${Math.min(0,dx)}px)`;
      mask.style.opacity = Math.max(1 + dx/sidebar.offsetWidth, 0);
      if(dx > 0){ sidebar.style.transform='translateX(0)'; mask.style.opacity=1; }
    }
  },{passive:true});

  document.addEventListener('touchend',e=>{
    if(!isMobile()) return;
    if(!tracking){ tracking=false; trackingDirection=null; return; }
    const t = e.changedTouches[0];
    const dx = t.clientX - sx;
    const panelW = sidebar.offsetWidth;
    sidebar.style.transition='transform .22s cubic-bezier(.4,0,.2,1)';
    mask.style.transition='opacity .22s';

    if(trackingDirection === 'open'){
      if(dx > panelW * TRIGGER_RATIO){
        // 打开成功
        sidebar.style.transform='translateX(0)';
        mask.style.opacity=1;
        sidebar.classList.add('drawer-open');
      }else{
        // 回弹关闭
        sidebar.style.transform='translateX(-100%)';
        mask.style.opacity=0;
        setTimeout(()=>{
          sidebar.classList.remove('drawer-open');
          mask.classList.remove('show');
          document.body.style.overflow='';
        },220);
      }
    }else if(trackingDirection === 'close'){
      if(Math.abs(dx) > panelW * TRIGGER_RATIO){
        // 关闭成功
        sidebar.style.transform='translateX(-100%)';
        mask.style.opacity=0;
        setTimeout(()=>{
          sidebar.classList.remove('drawer-open');
          mask.classList.remove('show');
          document.body.style.overflow='';
        },220);
      }else{
        // 回弹打开
        sidebar.style.transform='translateX(0)';
        mask.style.opacity=1;
      }
    }

    setTimeout(()=>{
      sidebar.style.transform='';
      sidebar.style.transition='';
      mask.style.transition='';
    },230);
    tracking=false; trackingDirection=null;
  },{passive:true});
})();

// ============ 数据加载与初始渲染（P1：data/trips.json 为唯一数据源） ============
async function loadTripData(){
  const res = await fetch('data/trips.json', {cache:'no-cache'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const d = await res.json();
  DAYS          = d.DAYS || {};
  TIME_SCHEDULE = d.TIME_SCHEDULE || {};
  TRIPS         = d.TRIPS || [];
  BUDGET_DATA   = d.BUDGET_DATA || {};
  MAP_POINTS    = d.MAP_POINTS || {};
  TRIP_SEGMENTS = d.TRIP_SEGMENTS || [];
  if(!TRIPS.length || !Object.keys(DAYS).length) throw new Error('trips.json 内容为空');
}

(async function boot(){
  try{
    await loadTripData();
    state.selectedTripId  = TRIPS[0].id;
    state.selectedDate    = TRIPS[0].start;
    state.selectedDayKey  = Object.keys(DAYS)[0];
    render();
  }catch(err){
    console.error('行程数据加载失败：', err);
    const main = document.getElementById('main');
    if(main) main.innerHTML = '<div style="padding:48px 24px;text-align:center;color:#ef4444;font-size:15px">行程数据加载失败，请检查网络后刷新重试。</div>';
  }
})();
</script>
